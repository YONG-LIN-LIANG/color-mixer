<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>家具修復調色練習器</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #f4f1ec;
      color: #222;
    }
    .language-bar { display:flex; justify-content:flex-end; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
    .language-bar button { padding:8px 12px; background:#e9e6e1; color:#333; }
    .language-bar button.active { background:#222; color:#fff; }
    .app {
      max-width: 980px;
      margin: 32px auto;
      padding: 24px;
    }
    h1 { margin: 0 0 8px; }
    .sub { color: #666; margin-bottom: 24px; }
    .card {
      background: white;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 18px;
      box-shadow: 0 5px 24px rgba(0,0,0,.07);
    }
    .compare {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }
    .swatch {
      height: 180px;
      border-radius: 14px;
      border: 1px solid #ddd;
    }
    .label {
      font-weight: 700;
      margin-bottom: 8px;
    }
    .info {
      margin-top: 8px;
      font-family: ui-monospace, monospace;
      font-size: 14px;
    }
    .controls {
      display: grid;
      gap: 12px;
    }
    .paint {
      display: grid;
      grid-template-columns: 38px 90px 110px 1fr 90px 44px;
      gap: 12px;
      align-items: center;
    }
    .dot {
      width: 28px;
      height: 28px;
      border-radius: 50%;
      border: 1px solid #bbb;
    }
    input[type=range] { width: 100%; }
    .paint-color {
      width: 34px !important;
      height: 34px !important;
      padding: 0;
      border-radius: 50%;
      overflow: hidden;
      cursor: pointer;
    }
    .paint-name-input {
      width: 100%;
      min-width: 90px;
      padding: 8px 9px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      font: inherit;
      font-weight: 650;
    }
    .paint-name-input:focus {
      outline: 2px solid rgba(0,0,0,.10);
      border-color: #888;
    }

    .hex-input {
      width: 104px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: ui-monospace, monospace;
      text-transform: uppercase;
    }
    .hex-input.invalid,
    #targetHex.invalid { border-color: #c62828; background: #fff3f3; }
    .remove-paint {
      padding: 8px 10px;
      background: #f1f1f1;
      color: #777;
    }
    .remove-paint:disabled { opacity: .25; cursor: not-allowed; }
    .paint-actions { margin-top: 14px; }
    .amount-input {
      width: 78px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      text-align: right;
      font: inherit;
    }
    input[type=color] {
      width: 58px;
      height: 40px;
      border: 0;
      background: transparent;
    }
    button {
      border: 0;
      border-radius: 10px;
      padding: 11px 16px;
      cursor: pointer;
      font-weight: 700;
    }
    .primary {
      background: #222;
      color: white;
    }
    .secondary {
      background: #eee;
    }
    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .score {
      font-size: 32px;
      font-weight: 800;
    }
    .hint {
      margin-top: 12px;
      padding: 12px;
      border-radius: 10px;
      background: #f5f5f5;
    }
    @media (max-width: 650px) {
      .compare { grid-template-columns: 1fr; }
      .paint {
        grid-template-columns: 38px 62px 92px 1fr 72px 38px;
      }
    }

    .target-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px 18px;
      align-items: center;
      justify-content: space-between;
    }
    .target-field, .target-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .target-hex-input {
      width: 112px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-family: ui-monospace, monospace;
      text-transform: uppercase;
    }
    .total-ml-input {
      width: 92px;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      text-align: right;
      font: inherit;
    }
    .paint-header {
      display: grid;
      grid-template-columns: 38px 90px 110px minmax(120px,1fr) 90px 86px 44px;
      gap: 12px;
      align-items: center;
      padding: 0 0 7px;
      color: #777;
      font-size: 12px;
      font-weight: 700;
    }
    .paint {
      grid-template-columns: 38px 90px 110px minmax(120px,1fr) 90px 86px 44px;
    }
    .ml-output {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      justify-content: flex-end;
      padding: 8px 7px;
      border-radius: 8px;
      background: #f5f5f5;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    .ml-output.locked {
      color: #999;
      font-weight: 600;
    }
    .match-volume-notice {
      margin-top: 10px;
      padding: 11px 12px;
      border-radius: 10px;
      background: #fff8e1;
      color: #6d5200;
      font-size: 14px;
      line-height: 1.45;
    }
    .match-volume-notice.ready {
      background: #edf7ed;
      color: #245b2a;
    }

    @media (max-width: 820px) {
      .app { margin: 16px auto; padding: 14px; }
      .card { padding: 16px; }
      .target-controls { align-items: stretch; }
      .target-field, .target-buttons { width: 100%; }
      .target-buttons button { flex: 1 1 140px; }
      .paint-header { display: none; }
      .paint {
        grid-template-columns: 38px minmax(90px,1fr) 100px 40px;
        gap: 9px;
        padding: 12px;
        border: 1px solid #e8e8e8;
        border-radius: 12px;
      }
      .paint > .paint-color { grid-column: 1; grid-row: 1; }
      .paint > strong,
      .paint > .paint-name-input { grid-column: 2; grid-row: 1; min-width: 0; }
      .paint > .hex-input { grid-column: 3; grid-row: 1; width: 100%; }
      .paint > .remove-paint { grid-column: 4; grid-row: 1; }
      .paint > input[type="range"] { grid-column: 1 / 4; grid-row: 2; }
      .paint > .amount-input { grid-column: 3; grid-row: 2; width: 100%; }
      .paint > .ml-output { grid-column: 1 / 5; grid-row: 3; justify-content: center; }
    }

    @media (max-width: 520px) {
      body { font-size: 15px; }
      .app { padding: 10px; margin: 8px auto; }
      h1 { font-size: 24px; }
      h2 { font-size: 20px; }
      .score { font-size: 27px; }
      .swatch { height: 130px; }
      .target-field { align-items: center; }
      .target-hex-input { flex: 1 1 130px; width: auto; }
      .total-ml-input { width: 88px; }
      .paint {
        grid-template-columns: 36px minmax(0,1fr) 92px 38px;
        gap: 8px;
      }
      .hex-input { width: 100%; }
      .paint-name-input { min-width: 0; }
      button { padding: 10px 12px; }
      .info { font-size: 12px; overflow-wrap: anywhere; }
    }

  
    .auto-mix-status {
      margin-top: 12px;
      padding: 11px 12px;
      border-radius: 10px;
      background: #f5f5f5;
      color: #555;
      font-size: 14px;
      line-height: 1.5;
    }
    .auto-mix-status.success {
      background: #edf7ed;
      color: #245b2a;
    }
    #autoMixBtn:disabled { opacity: .55; cursor: wait; }

    @media (max-width: 520px) {
      #autoMixBtn { flex: 1 1 140px; }
      .paint-actions { align-items: stretch; }
    }
  
    .recommended-paint-panel {
      margin-top: 12px;
      padding: 14px;
      border: 1px solid #eadfb5;
      border-radius: 12px;
      background: #fffaf0;
    }
    .recommended-title {
      font-weight: 850;
      margin-bottom: 10px;
    }
    .recommended-body {
      display: grid;
      grid-template-columns: 48px minmax(0,1fr) auto;
      gap: 12px;
      align-items: center;
    }
    .recommended-swatch {
      width: 48px;
      height: 48px;
      border-radius: 10px;
      border: 1px solid rgba(0,0,0,.14);
    }
    .recommended-copy {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .recommended-copy span {
      font-family: ui-monospace, monospace;
      font-weight: 800;
    }
    .recommended-copy small {
      color: #666;
      line-height: 1.45;
    }
    @media (max-width: 620px) {
      .recommended-body {
        grid-template-columns: 48px minmax(0,1fr);
      }
      #addRecommendedBtn {
        grid-column: 1 / -1;
        width: 100%;
      }
    }

    .mobile-live-preview{display:none}
    @media(max-width:650px){
      .mobile-live-preview{display:grid;grid-template-columns:1fr 1fr auto;gap:8px;align-items:stretch;position:sticky;top:8px;z-index:1000;margin:0 0 12px;padding:8px;border:1px solid rgba(0,0,0,.08);border-radius:14px;background:rgba(255,255,255,.94);box-shadow:0 6px 22px rgba(0,0,0,.12);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
      .mobile-preview-label{display:block;margin-bottom:5px;font-size:11px;font-weight:800;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
      .mobile-preview-swatch{height:54px;border:1px solid rgba(0,0,0,.14);border-radius:10px}
      .mobile-preview-hex{display:block;margin-top:4px;font-family:ui-monospace,monospace;font-size:11px;text-align:center}
      .mobile-preview-score{min-width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 6px;border-radius:10px;background:#f5f5f5}
      .mobile-preview-score-label{font-size:10px;font-weight:700;color:#666} #mobileMatch{font-size:18px;font-weight:850;line-height:1.15}
    }


    @media(max-width:650px){
      .desktop-compare-card,
      .desktop-match-card{display:none !important}

      .mobile-preview-details{
        grid-column:1 / -1;
        padding-top:8px;
        border-top:1px solid rgba(0,0,0,.08);
        font-size:12px;
        line-height:1.4;
      }
      .mobile-preview-hint{
        margin-top:5px;
        padding:7px 8px;
        border-radius:8px;
        background:#f5f5f5;
      }
      .mobile-preview-volume{
        margin-top:5px;
        padding:7px 8px;
        border-radius:8px;
        background:#fff8e1;
        color:#6d5200;
      }
      .mobile-preview-volume.ready{
        background:#edf7ed;
        color:#245b2a;
      }
    }

  
    /* RWD fix: keep the ratio slider and numeric input in separate grid areas */
    @media (max-width: 820px) {
      .paint {
        grid-template-columns: 38px minmax(0, 1fr) 100px 40px;
        grid-template-areas:
          "color name hex remove"
          "slider slider amount amount"
          "ml ml ml ml";
      }

      .paint > .paint-color {
        grid-area: color;
      }

      .paint > strong,
      .paint > .paint-name-input {
        grid-area: name;
        min-width: 0;
      }

      .paint > .hex-input {
        grid-area: hex;
        width: 100%;
        min-width: 0;
      }

      .paint > .remove-paint {
        grid-area: remove;
      }

      .paint > input[type="range"] {
        grid-area: slider;
        width: 100%;
        min-width: 0;
        margin: 0;
      }

      .paint > .amount-input {
        grid-area: amount;
        width: 100%;
        min-width: 0;
      }

      .paint > .ml-output {
        grid-area: ml;
        justify-content: center;
      }
    }

    @media (max-width: 520px) {
      .paint {
        grid-template-columns: 36px minmax(0, 1fr) 92px 38px;
        grid-template-areas:
          "color name hex remove"
          "slider slider amount amount"
          "ml ml ml ml";
      }
    }

    @media (max-width: 390px) {
      .paint {
        grid-template-columns: 34px minmax(0, 1fr) 82px 36px;
        gap: 7px;
      }

      .paint > .hex-input,
      .paint > .amount-input {
        padding-left: 6px;
        padding-right: 6px;
        font-size: 13px;
      }
    }

</style>
</head>
<body>
<div class="app">
  <div class="language-bar" aria-label="Language"><button type="button" data-lang="zh-TW" onclick="setLanguage('zh-TW')">繁中</button><button type="button" data-lang="zh-CN" onclick="setLanguage('zh-CN')">简中</button><button type="button" data-lang="en" onclick="setLanguage('en')">English</button></div>
  <h1 id="appTitle">🎨 家具修復調色練習器</h1>
  <div id="appSubtitle" class="sub">使用紅、黃、藍、白、黑，盡量調出目標木色。</div>

  <div class="card target-card">
    <div class="target-controls">
      <div class="target-field">
        <strong id="targetLabel">Target：</strong>
        <input id="targetPicker" type="color" value="#8b6248">
        <input id="targetHex" class="target-hex-input" value="#8B6248"
               aria-label="Target HEX">
      </div>
      <div class="target-field">
        <label for="targetTotalMl"><strong id="targetTotalLabel">目標總量：</strong></label>
        <input id="targetTotalMl" class="total-ml-input" type="number"
               min="0.1" step="0.1" value="10.0" inputmode="decimal">
        <span>mL</span>
      </div>
      <div class="target-buttons">
        <button id="randomTargetBtn" class="secondary" onclick="randomTarget()">隨機木色</button>
        <button id="resetMixBtn" class="secondary" onclick="resetMix()">重新開始</button>
      </div>
    </div>
  </div>

  <div id="mobileLivePreview" class="mobile-live-preview" aria-live="polite">
    <div><span id="mobileTargetLabel" class="mobile-preview-label">🎯 Target</span><div id="mobileTargetSwatch" class="mobile-preview-swatch"></div><span id="mobileTargetHex" class="mobile-preview-hex"></span></div>
    <div><span id="mobileMixLabel" class="mobile-preview-label">🧪 Your Mix</span><div id="mobileMixSwatch" class="mobile-preview-swatch"></div><span id="mobileMixHex" class="mobile-preview-hex"></span></div>
    <div class="mobile-preview-score"><span id="mobileMatchLabel" class="mobile-preview-score-label">Match</span><span><span id="mobileMatch">0.0</span>%</span></div>
    <div class="mobile-preview-details">
      <div>ΔE76：<strong id="mobileDeltaE">0</strong></div>
      <div id="mobileHint" class="mobile-preview-hint"></div>
      <div id="mobileMatchVolumeNotice" class="mobile-preview-volume" aria-live="polite"></div>
    </div>
  </div>

  <div class="card compare desktop-compare-card">
    <div>
      <div id="targetSwatchLabel" class="label">🎯 Target</div>
      <div id="targetSwatch" class="swatch"></div>
      <div id="targetInfo" class="info"></div>
    </div>
    <div>
      <div id="mixSwatchLabel" class="label">🧪 Your Mix</div>
      <div id="mixSwatch" class="swatch"></div>
      <div id="mixInfo" class="info"></div>
    </div>
  </div>

  <div class="card desktop-match-card">
    <div class="score">
      <span id="matchLabel">Match</span>：<span id="match">0</span>%
    </div>
    <div>
      ΔE76：<strong id="deltaE">0</strong>
    </div>
    <div id="hint" class="hint"></div>
    <div id="matchVolumeNotice" class="match-volume-notice" aria-live="polite"></div>
  </div>

  <div class="card">
    <h2 id="paintRatioTitle">顏料比例</h2>
    <div class="paint-header" aria-hidden="true">
      <span id="hdrColor">顏色</span><span id="hdrName">名稱</span><span>HEX</span><span id="hdrRatio">比例</span><span id="hdrValue">數值</span><span id="hdrUsage">用量 (ml)</span><span></span>
    </div>
    <div id="controls" class="controls"></div>
    <div class="row paint-actions">
      <button id="addPaintBtn" class="secondary" onclick="addPaint()">＋ 新增顏料</button>
      <button id="autoMixBtn" class="primary" onclick="autoMix()">⚡ Auto Mix</button>
      <span id="paintHelp" style="color:#666;font-size:14px">可加入接近木色的現成顏料，可直接輸入 HEX 或使用色彩選擇器。</span>
    </div>
    <div id="autoMixStatus" class="auto-mix-status"></div>

    <div id="recommendedPaintPanel" class="recommended-paint-panel" hidden>
      <div id="recommendedTitle" class="recommended-title">🎨 Recommended Paint</div>
      <div class="recommended-body">
        <span id="recommendedSwatch" class="recommended-swatch"></span>
        <div class="recommended-copy">
          <strong id="recommendedName">建議修正色</strong>
          <span id="recommendedHex"></span>
          <small id="recommendedReason"></small>
        </div>
        <button id="addRecommendedBtn" class="secondary" type="button">＋ 加入建議顏料</button>
      </div>
    </div>
  </div>
</div>

<script>
let currentLanguage = localStorage.getItem("furnitureMixerLanguage") || "zh-TW";

const i18n = {
  "zh-TW": {
    pageTitle:"調色練習器", appTitle:"🎨 調色練習器", subtitle:"使用紅、黃、藍、白、黑，盡量調出目標顏色。",
    target:"Target：", targetTotal:"目標總量：", randomWood:"隨機木色", reset:"重新開始", targetSwatch:"🎯 Target", yourMix:"🧪 Your Mix", match:"Match",
    paintRatio:"顏料比例", color:"顏色", name:"名稱", ratio:"比例", value:"數值", usage:"用量 (ml)", addPaint:"＋ 新增顏料",
    paintHelp:"可加入接近木色的現成顏料，可直接輸入 HEX 或使用色彩選擇器。",
    autoIntro:"Auto Mix 會搜尋目前所有顏料的非負比例（每種 ≥ 0%），以目前 App 的混色模型找出最高 Match 配方；若某色不需要，會顯示 0%。",
    recommendedTitle:"🎨 Recommended Paint", suggestedCorrection:"建議修正色", addRecommended:"＋ 加入建議顏料",
    red:"紅", yellow:"黃", blue:"藍", white:"白", black:"黑", wood:"木色", paintName:"顏料名稱", customPaintName:"自訂顏料名稱",
    setColor:n=>`設定 ${n} 顏色`, unlockTitle:"Match 達到 95% 後顯示", baseNoDelete:"基礎顏料不能刪除", deletePaint:"刪除這個顏料",
    tooLight:"目前太亮", tooDark:"目前太暗", tooRed:"目前偏紅", needRed:"紅色不足", tooYellow:"目前偏黃", needYellow:"黃色不足／偏藍", veryClose:"🔥 非常接近目標色！", hint:"提示：",
    volumeReady:(m,ml)=>`✓ Match 已達 ${m}%。已依目標總量 ${ml} mL 計算各顏料用量；各項 mL 加總為 ${ml} mL。`,
    volumeLocked:(m,r)=>`各顏料 mL 用量會在 Match 達到 95% 後顯示。目前 ${m}%，還差 ${r} 個百分點。`,
    correction:"修正色", deepWarm:"深暖棕修正色", deepRedBrown:"深紅棕修正色", deep:"深色修正色", lightWarm:"淺暖木色修正色", light:"淺色修正色", redCorrection:"偏紅修正色", reduceRed:"降紅修正色", yellowCorrection:"偏黃修正色", reduceYellow:"降黃修正色",
    recReason:(m,h)=>`目前顏料庫最佳 Match 為 ${m}%。建議尋找接近 ${h} 的實體顏料作為修正色，加入後再按 Auto Mix。這是依目前數學混色模型計算的修正方向，不代表特定品牌實體顏料一定完全相同。`,
    recAdded:(n,h)=>`${n} ${h} 已加入顏料庫（0.0%）。請再次按 Auto Mix，程式會把它一起納入計算。`, invalidTarget:"請先輸入有效的 Target HEX。", calculating:"Auto Mix 計算中…", complete:(m,de,u)=>`Auto Mix 完成：Match ${m}%，ΔE76 ${de}。${u}`
  },
  "zh-CN": {
    pageTitle:"调色练习器", appTitle:"🎨 调色练习器", subtitle:"使用红、黄、蓝、白、黑，尽量调出目标色。",
    target:"Target：", targetTotal:"目标总量：", randomWood:"随机木色", reset:"重新开始", targetSwatch:"🎯 Target", yourMix:"🧪 Your Mix", match:"Match",
    paintRatio:"颜料比例", color:"颜色", name:"名称", ratio:"比例", value:"数值", usage:"用量 (ml)", addPaint:"＋ 新增颜料",
    paintHelp:"可加入接近木色的现成颜料，可直接输入 HEX 或使用色彩选择器。",
    autoIntro:"Auto Mix 会搜索目前所有颜料的非负比例（每种 ≥ 0%），以当前 App 的混色模型找出最高 Match 配方；若某色不需要，会显示 0%。",
    recommendedTitle:"🎨 Recommended Paint", suggestedCorrection:"建议修正色", addRecommended:"＋ 加入建议颜料",
    red:"红", yellow:"黄", blue:"蓝", white:"白", black:"黑", wood:"木色", paintName:"颜料名称", customPaintName:"自定义颜料名称",
    setColor:n=>`设置 ${n} 颜色`, unlockTitle:"Match 达到 95% 后显示", baseNoDelete:"基础颜料不能删除", deletePaint:"删除这个颜料",

const paints = [
  {name:"Red", hex:"#D62828", amount:20, base:true},
  {name:"Yellow", hex:"#F6BD32", amount:45, base:true},
  {name:"Blue", hex:"#244A8F", amount:5, base:true},
  {name:"White", hex:"#FFFFFF", amount:20, base:true},
  {name:"Black", hex:"#111111", amount:10, base:true}
];

const controls = document.getElementById("controls");

function buildControls() {
  controls.innerHTML = "";

  paints.forEach((p,i) => {
    const row = document.createElement("div");
    row.className = "paint";

    row.innerHTML = `
      <input class="paint-color" type="color" value="${p.hex}"
             title="${tr("setColor",p.name)}"
             oninput="setPaintColor(${i},this.value)">
      ${p.base
        ? `<strong title="${p.hex}">${p.name}</strong>`
        : `<input class="paint-name-input" type="text"
                  value="${escapeHtml(p.name)}"
                  placeholder="${tr("paintName")}"
                  aria-label="${tr("customPaintName")}"
                  oninput="setPaintName(${i},this.value)">`}
      <input id="hex${i}" class="hex-input" type="text" value="${p.hex}" maxlength="7"
             aria-label="${p.name} HEX"
             oninput="setPaintHex(${i},this.value)">
      <input type="range"
             min="0"
             max="100"
             step="0.1"
             value="${p.amount}"
             oninput="setAmount(${i},this.value, 'slider')">
      <input id="amt${i}"
             class="amount-input"
             type="number"
             min="0"
             max="100"
             step="0.1"
             value="${Number(p.amount).toFixed(1)}"
             oninput="setAmount(${i},this.value, 'input')">
      <span id="ml${i}" class="ml-output locked" title="${tr("unlockTitle")}">—</span>
      <button class="remove-paint" ${p.base ? 'disabled' : ''}
              title="${p.base ? tr('baseNoDelete') : tr('deletePaint')}"
              onclick="removePaint(${i})">×</button>
    `;

    controls.appendChild(row);
  });
}

function escapeHtml(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/"/g, "&quot;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

function setPaintName(i, value) {
  if (!paints[i] || paints[i].base) return;
  paints[i].name = value;
}

function addPaint() {
  const n = paints.filter(p => !p.base).length + 1;
  paints.push({
    name: tr("wood") + " " + n,
    hex: "#8B6248",
    amount: 0,
    base: false
  });
  buildControls();
  update();
}

function removePaint(i) {
  if (paints[i]?.base) return;
  paints.splice(i, 1);
  buildControls();
  update();
}

function setPaintColor(i, hex) {
  const value = hex.toUpperCase();
  paints[i].hex = value;
  const hexInput = document.getElementById("hex" + i);
  if (hexInput) {
    hexInput.value = value;
    hexInput.classList.remove("invalid");
  }
  update();
}

function setPaintHex(i, value) {
  let hex = value.trim().toUpperCase();
  if (hex && !hex.startsWith("#")) hex = "#" + hex;

  const input = document.getElementById("hex" + i);
  if (!/^#[0-9A-F]{6}$/.test(hex)) {
    if (input) input.classList.add("invalid");
    return;
  }

  paints[i].hex = hex;
  if (input) {
    input.value = hex;
    input.classList.remove("invalid");
  }

  const row = controls.children[i];
  const picker = row?.querySelector('input[type="color"]');
  if (picker) picker.value = hex.toLowerCase();
  update();
}

function setAmount(i,v,source) {
  let value = parseFloat(v);
  if (!Number.isFinite(value)) return;

  // Paint can be added, never subtracted.
  value = Math.max(0, Math.min(100, value));
  value = Math.round(value * 10) / 10;
  paints[i].amount = value;

  const row = controls.children[i];
  const slider = row.querySelector('input[type="range"]');
  const numberInput = document.getElementById("amt"+i);

  if (source !== 'slider') slider.value = value;
  if (source !== 'input') numberInput.value = value.toFixed(1);

  update();
}

function normalizeAmountInputs() {
  paints.forEach((p,i) => {
    const input = document.getElementById("amt"+i);
    if (input) input.value = Number(p.amount).toFixed(1);
  });
}

function hexToRgb(hex) {
  hex = hex.replace("#","");
  return {
    r: parseInt(hex.slice(0,2),16),
    g: parseInt(hex.slice(2,4),16),
    b: parseInt(hex.slice(4,6),16)
  };
}

function rgbToHex(r,g,b) {
  const f = n => {
    const value = Number(n);
    if (!Number.isFinite(value)) return "00";
    return Math.max(0, Math.min(255, Math.round(value)))
      .toString(16)
      .padStart(2,"0");
  };

  return "#" + f(r) + f(g) + f(b);
}

/*
  簡化的減法混色：
  先把 RGB 轉成「吸收量」：
  A = -ln(reflectance)
  然後依顏料比例平均吸收量，
  最後再轉回 RGB。

  這比直接 RGB 平均更像顏料混色，
  但仍然不是完整 Kubelka-Munk。
*/
function mixPaints() {
  const safeAmounts = paints.map(p => {
    const value = Number(p.amount);
    return Number.isFinite(value) ? Math.max(0, value) : 0;
  });

  const total = safeAmounts.reduce((s, v) => s + v, 0);

  if (!Number.isFinite(total) || total <= 0)
    return {r:255,g:255,b:255};

  let ar=0, ag=0, ab=0;

  paints.forEach((p, i) => {
    const rgb = hexToRgb(p.hex);
    if (![rgb.r, rgb.g, rgb.b].every(Number.isFinite)) return;

    const w = safeAmounts[i] / total;

    const r = Math.max(rgb.r/255,0.001);
    const g = Math.max(rgb.g/255,0.001);
    const b = Math.max(rgb.b/255,0.001);

    ar += -Math.log(r) * w;
    ag += -Math.log(g) * w;
    ab += -Math.log(b) * w;
  });

  const result = {
    r:255*Math.exp(-ar),
    g:255*Math.exp(-ag),
    b:255*Math.exp(-ab)
  };

  if (![result.r, result.g, result.b].every(Number.isFinite)) {
    return {r:255,g:255,b:255};
  }

  return result;
}

function rgbToHsv(r,g,b) {
  r/=255; g/=255; b/=255;

  let max=Math.max(r,g,b);
  let min=Math.min(r,g,b);
  let d=max-min;

  let h=0;

  if(d!==0){
    if(max===r)
      h=60*(((g-b)/d)%6);
    else if(max===g)
      h=60*((b-r)/d+2);
    else
      h=60*((r-g)/d+4);
  }

  if(h<0) h+=360;

  const s=max===0 ? 0 : d/max;

  return {
    h:Math.round(h),
    s:Math.round(s*100),
    v:Math.round(max*100)
  };
}

/* ---------- RGB -> LAB ---------- */

function rgbToLab(r,g,b) {

  r/=255; g/=255; b/=255;

  const lin = c =>
    c <= .04045
      ? c/12.92
      : Math.pow((c+.055)/1.055,2.4);

  r=lin(r);
  g=lin(g);
  b=lin(b);

  let x=(r*.4124+g*.3576+b*.1805)/.95047;
  let y=(r*.2126+g*.7152+b*.0722);
  let z=(r*.0193+g*.1192+b*.9505)/1.08883;

  const f=t =>
    t>.008856
      ? Math.cbrt(t)
      : 7.787*t+16/116;

  x=f(x);
  y=f(y);
  z=f(z);

  return {
    L:116*y-16,
    a:500*(x-y),
    b:200*(y-z)
  };
}

function deltaE76(a,b) {
  return Math.sqrt(
    (a.L-b.L)**2 +
    (a.a-b.a)**2 +
    (a.b-b.b)**2
  );
}

function makeHint(targetLab,mixLab) {

  let hints=[];

  const dL=mixLab.L-targetLab.L;
  const da=mixLab.a-targetLab.a;
  const db=mixLab.b-targetLab.b;

  if(Math.abs(dL)>2)
    hints.push(dL>0 ? tr("tooLight") : tr("tooDark"));

  if(Math.abs(da)>2)
    hints.push(da>0 ? tr("tooRed") : tr("needRed"));

  if(Math.abs(db)>2)
    hints.push(db>0 ? tr("tooYellow") : tr("needYellow"));

  if(hints.length===0)
    return tr("veryClose");

  return tr("hint") + hints.join(currentLanguage === "en" ? "; " : "、") +
    ` ｜ ΔL* ${(dL >= 0 ? "+" : "") + dL.toFixed(2)}` +
    ` ｜ Δa* ${(da >= 0 ? "+" : "") + da.toFixed(2)}` +
    ` ｜ Δb* ${(db >= 0 ? "+" : "") + db.toFixed(2)}`;
}

function updateVolumeBreakdown(matchValue) {
  const totalMlInput = document.getElementById("targetTotalMl");
  const totalMl = Math.max(0, parseFloat(totalMlInput?.value) || 0);
  const notice = document.getElementById("matchVolumeNotice");
  const totalParts = paints.reduce((sum, p) => sum + (Number(p.amount) || 0), 0);
  const unlocked = matchValue >= 95 && totalParts > 0 && totalMl > 0;

  paints.forEach((p, i) => {
    const output = document.getElementById("ml" + i);
    if (!output) return;

    if (unlocked) {
      const ml = totalMl * (Number(p.amount) || 0) / totalParts;
      output.textContent = ml.toFixed(2);
      output.classList.remove("locked");
      output.title = `${p.name}：${ml.toFixed(2)}`;
    } else {
      output.textContent = "—";
      output.classList.add("locked");
      output.title = tr("unlockTitle");
    }
  });

  if (!notice) return;

  if (unlocked) {
    notice.classList.add("ready");
    notice.textContent =
      tr("volumeReady", matchValue.toFixed(1), totalMl.toFixed(1));
  } else {
    notice.classList.remove("ready");
    const remaining = Math.max(0, 95 - matchValue);
    notice.textContent =
      tr("volumeLocked", matchValue.toFixed(1), remaining.toFixed(1));
  }
}


function mixPaintsFromAmounts(amounts) {
  const safeAmounts = amounts.map(v => {
    const n = Number(v);
    return Number.isFinite(n) ? Math.max(0, n) : 0;
  });
  const total = safeAmounts.reduce((s, v) => s + v, 0);
  if (!Number.isFinite(total) || total <= 0) return {r:255, g:255, b:255};

  let ar = 0, ag = 0, ab = 0;
  paints.forEach((p, i) => {
    const rgb = hexToRgb(p.hex);
    const w = safeAmounts[i] / total;
    ar += -Math.log(Math.max(rgb.r / 255, 0.001)) * w;
    ag += -Math.log(Math.max(rgb.g / 255, 0.001)) * w;
    ab += -Math.log(Math.max(rgb.b / 255, 0.001)) * w;
  });

  return {
    r: 255 * Math.exp(-ar),
    g: 255 * Math.exp(-ag),
    b: 255 * Math.exp(-ab)
  };
}

function scoreAmounts(amounts, targetLab) {
  const rgb = mixPaintsFromAmounts(amounts);
  const lab = rgbToLab(rgb.r, rgb.g, rgb.b);
  const de = deltaE76(targetLab, lab);
  return { de, match: Math.max(0, 100 - de * 2), rgb };
}

// Deterministic coordinate-descent optimizer.
// It searches normalized percentages and progressively reduces step size.
function optimizeMix(targetLab) {
  const n = paints.length;
  let best = paints.map(p => Math.max(0, Number(p.amount) || 0));

  // If everything is zero, seed evenly.
  if (best.reduce((a,b) => a+b, 0) <= 0) best = Array(n).fill(100 / n);

  const normalize = arr => {
    const clean = arr.map(v => Math.max(0, v));
    const total = clean.reduce((a,b) => a+b, 0);
    return total > 0 ? clean.map(v => v * 100 / total) : Array(n).fill(100 / n);
  };

  best = normalize(best);
  let bestScore = scoreAmounts(best, targetLab);

  // Several seeds improve the chance of escaping a poor local solution.
  const seeds = [
    best,
    Array(n).fill(100 / n),
    ...Array.from({length:n}, (_,k) => Array.from({length:n}, (_,i) => i === k ? 100 : 0))
  ];

  for (const seed of seeds) {
    let cur = normalize(seed);
    let curScore = scoreAmounts(cur, targetLab);

    for (const step of [20, 10, 5, 2, 1, 0.5, 0.2, 0.1]) {
      let improved = true;
      let guard = 0;

      while (improved && guard++ < 250) {
        improved = false;

        for (let from = 0; from < n; from++) {
          if (cur[from] < step) continue;

          for (let to = 0; to < n; to++) {
            if (from === to) continue;

            const candidate = cur.slice();

            // Physical paint constraint: a paint amount can never be negative.
            // Re-check against the CURRENT vector on every move because cur may
            // have changed earlier in this same optimization sweep.
            if (candidate[from] + 1e-9 < step) continue;

            candidate[from] = Math.max(0, candidate[from] - step);
            candidate[to] += step;

            // Safety guard: never evaluate or accept an impossible recipe.
            if (candidate.some(v => v < -1e-9)) continue;

            const s = scoreAmounts(candidate, targetLab);
            if (s.de + 1e-9 < curScore.de) {
              cur = candidate.map(v => Math.max(0, v));
              curScore = s;
              improved = true;
            }
          }
        }
      }
    }

    if (curScore.de < bestScore.de) {
      best = cur;
      bestScore = curScore;
    }
  }

  // Round to the UI's 0.1 precision, then correct rounding drift to exactly 100.0.
  best = best.map(v => Math.max(0, Math.round(v * 10) / 10));

  // Correct rounding drift while preserving the non-negative constraint.
  let diffTenths = Math.round((100 - best.reduce((a,b)=>a+b,0)) * 10);
  while (diffTenths !== 0) {
    if (diffTenths > 0) {
      const idx = best.indexOf(Math.max(...best));
      best[idx] = Math.round((best[idx] + 0.1) * 10) / 10;
      diffTenths--;
    } else {
      // Remove 0.1 only from a paint that actually has at least 0.1 available.
      let idx = -1;
      let maxVal = -1;
      best.forEach((v, i) => {
        if (v >= 0.1 && v > maxVal) { idx = i; maxVal = v; }
      });
      if (idx < 0) break;
      best[idx] = Math.max(0, Math.round((best[idx] - 0.1) * 10) / 10);
      diffTenths++;
    }
  }

  // Final physical safety clamp.
  best = best.map(v => Math.max(0, v));

  return { amounts: best, ...scoreAmounts(best, targetLab) };
}


function safeRgbToHex(rgb) {
  return rgbToHex(rgb.r, rgb.g, rgb.b).toUpperCase();
}

function recommendPaint(targetRgb, currentRgb, targetLab, currentLab) {
  const dL = targetLab.L - currentLab.L;
  const da = targetLab.a - currentLab.a;
  const db = targetLab.b - currentLab.b;

  let best = null;

  // Search a helper colour beyond the target in the direction needed to
  // correct the current best mix. Then test how well it blends back toward
  // the target using the same simplified subtractive model as the app.
  for (const k of [1.15, 1.3, 1.5, 1.8, 2.2, 2.8, 3.5, 4.5]) {
    const candidate = {
      r: Math.max(0, Math.min(255, targetRgb.r + k * (targetRgb.r - currentRgb.r))),
      g: Math.max(0, Math.min(255, targetRgb.g + k * (targetRgb.g - currentRgb.g))),
      b: Math.max(0, Math.min(255, targetRgb.b + k * (targetRgb.b - currentRgb.b)))
    };

    if (![candidate.r, candidate.g, candidate.b].every(Number.isFinite)) continue;

    for (let pct = 2; pct <= 90; pct += 1) {
      const w = pct / 100;
      const mixChannel = (a, b) => {
        const aa = -Math.log(Math.max(a / 255, 0.001));
        const bb = -Math.log(Math.max(b / 255, 0.001));
        return 255 * Math.exp(-(aa * (1 - w) + bb * w));
      };

      const mixed = {
        r: mixChannel(currentRgb.r, candidate.r),
        g: mixChannel(currentRgb.g, candidate.g),
        b: mixChannel(currentRgb.b, candidate.b)
      };

      if (![mixed.r, mixed.g, mixed.b].every(Number.isFinite)) continue;

      const lab = rgbToLab(mixed.r, mixed.g, mixed.b);
      const de = deltaE76(targetLab, lab);

      if (Number.isFinite(de) && (!best || de < best.de)) {
        best = {
          rgb: candidate,
          hex: safeRgbToHex(candidate),
          pct,
          de
        };
      }
    }
  }

  // Absolute fallback: target itself is always a valid search colour.
  if (!best) {
    best = {
      rgb: targetRgb,
      hex: safeRgbToHex(targetRgb),
      pct: 100,
      de: 0
    };
  }

  let name = tr("correction");
  if (dL < -1.2 && db > 1.2) name = tr("deepWarm");
  else if (dL < -1.2 && da > 1.2) name = tr("deepRedBrown");
  else if (dL < -1.2) name = tr("deep");
  else if (dL > 1.2 && db > 1.2) name = tr("lightWarm");
  else if (dL > 1.2) name = tr("light");
  else if (da > 1.2) name = tr("redCorrection");
  else if (da < -1.2) name = tr("reduceRed");
  else if (db > 1.2) name = tr("yellowCorrection");
  else if (db < -1.2) name = tr("reduceYellow");

  return {...best, name};
}

function showRecommendedPaint(result, targetRgb, targetLab) {
  const panel = document.getElementById("recommendedPaintPanel");
  if (!panel) return;

  // Existing palette is already good enough.
  if (!Number.isFinite(result.match) || result.match >= 95) {
    panel.hidden = true;
    return;
  }

  const currentRgb = result.rgb;
  if (![currentRgb.r, currentRgb.g, currentRgb.b].every(Number.isFinite)) {
    panel.hidden = true;
    return;
  }

  const currentLab = rgbToLab(currentRgb.r, currentRgb.g, currentRgb.b);
  const rec = recommendPaint(targetRgb, currentRgb, targetLab, currentLab);

  document.getElementById("recommendedSwatch").style.background = rec.hex;
  document.getElementById("recommendedName").textContent = rec.name;
  document.getElementById("recommendedHex").textContent = rec.hex;
  document.getElementById("recommendedReason").textContent =
    tr("recReason", result.match.toFixed(1), rec.hex);

  document.getElementById("addRecommendedBtn").onclick = () => {
    paints.push({
      name: rec.name,
      hex: rec.hex,
      amount: 0,
      base: false
    });

    buildControls();
    update();
    panel.hidden = true;

    const status = document.getElementById("autoMixStatus");
    status.classList.remove("success");
    status.textContent =
      tr("recAdded", rec.name, rec.hex);
  };

  panel.hidden = false;
}

function autoMix() {
  const btn = document.getElementById("autoMixBtn");
  const status = document.getElementById("autoMixStatus");
  let targetHex = document.getElementById("targetHex").value.trim().toUpperCase();
  if (targetHex && !targetHex.startsWith("#")) targetHex = "#" + targetHex;

  if (!/^#[0-9A-F]{6}$/.test(targetHex)) {
    status.classList.remove("success");
    status.textContent = tr("invalidTarget");
    return;
  }

  btn.disabled = true;
  status.classList.remove("success");
  status.textContent = tr("calculating");

  // Yield once so the loading state paints before CPU work begins.
  setTimeout(() => {
    const target = hexToRgb(targetHex);
    const targetLab = rgbToLab(target.r, target.g, target.b);
    const result = optimizeMix(targetLab);

    result.amounts.forEach((v, i) => paints[i].amount = v);
    buildControls();
    update();

    const used = paints
      .map((p,i) => ({name:p.name, amount:result.amounts[i]}))
      .filter(x => x.amount > 0)
      .map(x => `${x.name} ${x.amount.toFixed(1)}%`)
      .join("、");

    status.classList.add("success");
    status.textContent =
      tr("complete", result.match.toFixed(1), result.de.toFixed(2), used);

    showRecommendedPaint(result, target, targetLab);
    btn.disabled = false;
  }, 20);
}

function setTargetHex(value, normalizeInput = false) {
  let hex = String(value).trim().toUpperCase();

  // Allow users to type either C19A6B or #C19A6B.
  if (hex && !hex.startsWith("#")) hex = "#" + hex;

  const input = document.getElementById("targetHex");

  if (!/^#[0-9A-F]{6}$/.test(hex)) {
    if (input) input.classList.add("invalid");
    return false;
  }

  if (input) {
    input.classList.remove("invalid");
    if (normalizeInput) input.value = hex;
  }

  document.getElementById("targetPicker").value = hex.toLowerCase();

  // Update all target-dependent UI immediately.
  update(hex);
  return true;
}

function update(forcedTargetHex) {

  let targetHex = forcedTargetHex ||
    document.getElementById("targetHex")
      .value.trim().toUpperCase();

  if (targetHex && !targetHex.startsWith("#")) {
    targetHex = "#" + targetHex;
  }

  if(!/^#[0-9A-F]{6}$/.test(targetHex))
    return;

  document.getElementById("targetPicker").value =
    targetHex.toLowerCase();

  const target=hexToRgb(targetHex);
  let mix=mixPaints();

  // Rendering safety: never allow NaN/Infinity to reach HEX, HSV or LAB.
  if (![mix.r, mix.g, mix.b].every(Number.isFinite)) {
    mix = {r:255, g:255, b:255};
  }

  const mixHex=rgbToHex(
    mix.r,mix.g,mix.b
  ).toUpperCase();

  document.getElementById("targetSwatch")
    .style.background=targetHex;

  document.getElementById("mixSwatch")
    .style.background=mixHex;

  const mts=document.getElementById("mobileTargetSwatch"), mms=document.getElementById("mobileMixSwatch");
  const mth=document.getElementById("mobileTargetHex"), mmh=document.getElementById("mobileMixHex");
  if(mts) mts.style.background=targetHex; if(mms) mms.style.background=mixHex;
  if(mth) mth.textContent=targetHex; if(mmh) mmh.textContent=mixHex;

  const th=rgbToHsv(
    target.r,target.g,target.b
  );

  const mh=rgbToHsv(
    mix.r,mix.g,mix.b
  );

  const targetLab=rgbToLab(
    target.r,target.g,target.b
  );

  const mixLab=rgbToLab(
    mix.r,mix.g,mix.b
  );

  document.getElementById("targetInfo").innerHTML =
    `${targetHex}<br>
     RGB(${target.r}, ${target.g}, ${target.b})<br>
     HSV(${th.h}°, ${th.s}%, ${th.v}%)<br>
     CIELAB(${targetLab.L.toFixed(2)}, ${targetLab.a.toFixed(2)}, ${targetLab.b.toFixed(2)})`;

  document.getElementById("mixInfo").innerHTML =
    `${mixHex}<br>
     RGB(${Math.round(mix.r)},
         ${Math.round(mix.g)},
         ${Math.round(mix.b)})<br>
     HSV(${mh.h}°, ${mh.s}%, ${mh.v}%)<br>
     CIELAB(${mixLab.L.toFixed(2)}, ${mixLab.a.toFixed(2)}, ${mixLab.b.toFixed(2)})`;

  const de=deltaE76(
    targetLab,mixLab
  );

  document.getElementById("deltaE")
    .textContent=de.toFixed(2);
  const mobileDeltaE=document.getElementById("mobileDeltaE");
  if(mobileDeltaE) mobileDeltaE.textContent=de.toFixed(2);

  /*
    這裡 Match 是遊戲分數，
    並不是標準色彩學指標。
  */
  const match =
    Math.max(0,100-de*2);

  document.getElementById("match")
    .textContent=match.toFixed(1);
  const mobileMatch=document.getElementById("mobileMatch"); if(mobileMatch) mobileMatch.textContent=match.toFixed(1);

  updateVolumeBreakdown(match);

  const desktopVolumeNotice=document.getElementById("matchVolumeNotice");
  const mobileVolumeNotice=document.getElementById("mobileMatchVolumeNotice");
  if(desktopVolumeNotice && mobileVolumeNotice){
    mobileVolumeNotice.textContent=desktopVolumeNotice.textContent;
    mobileVolumeNotice.classList.toggle("ready",desktopVolumeNotice.classList.contains("ready"));
  }

  const hintText=makeHint(targetLab,mixLab);
  document.getElementById("hint").textContent=hintText;
  const mobileHint=document.getElementById("mobileHint");
  if(mobileHint) mobileHint.textContent=hintText;
}

function randomTarget() {

  /*
    刻意限制成比較像木材的
    brown / beige / walnut 色域
  */
  const r=Math.floor(
    90+Math.random()*110
  );

  const g=Math.floor(
    55+Math.random()*80
  );

  const b=Math.floor(
    30+Math.random()*65
  );

  const hex=rgbToHex(r,g,b)
    .toUpperCase();

  document.getElementById("targetHex")
    .value=hex;

  update();
}

function resetMix() {
  paints.forEach(p => p.amount = 0);
  buildControls();
  update();
}

document.getElementById("targetPicker")
  .addEventListener("input", e => {
    const hex = e.target.value.toUpperCase();
    document.getElementById("targetHex").value = hex;
    setTargetHex(hex, true);
  });

const targetHexInput = document.getElementById("targetHex");

targetHexInput.addEventListener("input", e => {
  // Update as soon as a complete valid HEX has been entered.
  setTargetHex(e.target.value, false);
  const panel = document.getElementById("recommendedPaintPanel");
  if (panel) panel.hidden = true;
});

targetHexInput.addEventListener("change", e => {
  // Normalize C19A6B -> #C19A6B when the field loses focus.
  setTargetHex(e.target.value, true);
});

targetHexInput.addEventListener("keydown", e => {
  if (e.key === "Enter") {
    e.preventDefault();
    setTargetHex(e.target.value, true);
    e.target.blur();
  }
});

controls.addEventListener("change", e => {
  if (e.target.classList.contains("amount-input")) {
    normalizeAmountInputs();
  }
});

document.getElementById("targetTotalMl").addEventListener("input", () => {
  const matchValue = parseFloat(document.getElementById("match").textContent) || 0;
  updateVolumeBreakdown(matchValue);
  const desktopVolumeNotice=document.getElementById("matchVolumeNotice");
  const mobileVolumeNotice=document.getElementById("mobileMatchVolumeNotice");
  if(desktopVolumeNotice && mobileVolumeNotice){
    mobileVolumeNotice.textContent=desktopVolumeNotice.textContent;
    mobileVolumeNotice.classList.toggle("ready",desktopVolumeNotice.classList.contains("ready"));
  }
});

setLanguage(currentLanguage);
</script>
